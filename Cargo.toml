[package]
name = "fcpm"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { version = "0.4", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
default = ["logging"]
logging = ["dep:log"]

[dev-dependencies]
tempfile = "3.23.0"
test-log = "0.2"
