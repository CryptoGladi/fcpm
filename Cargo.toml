[package]
name = "fcpm"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { version = "0.4", optional = true }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking"], optional = true }

[features]
default = ["logging", "http"]
logging = ["dep:log"]
http = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3.23"
test-log = "0.2"
